server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: rutas del cliente (React Router) resuelven a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash: cache agresiva e inmutable
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # No cachear el HTML de entrada
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
